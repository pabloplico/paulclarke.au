# =============================================================================
# Admin Portal — development services (Postgres, Redis, optional Ollama)
# =============================================================================
# The app itself runs on the host (see CLAUDE.md). This stack is only needed for
# the full setup: Postgres + pgvector and Redis for the BullMQ workers.
#
# Usage (from apps/admin-portal):
#   export COMPOSE_ENV_FILES=../../.env.docker   # compose reads its ${VARS} here
#   docker compose up -d                         # Postgres 5432 + Redis 6379
#   docker compose --profile ai up -d            # also Ollama on 11434
#   docker compose down                          # stop (data stays in volumes)
#
# Then run the app on the host against these services:
#   pnpm nx run admin-portal:dev:full
# =============================================================================

name: admin-portal-dev

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: admin-portal-dev-postgres
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-business_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-business_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-business_portal}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: admin-portal-dev-redis
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password required}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: admin-portal-dev-ollama
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai

volumes:
  postgres_data:
  redis_data:
  ollama_data:
