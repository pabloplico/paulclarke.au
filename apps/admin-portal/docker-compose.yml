# =============================================================================
# Admin Portal — Development
# =============================================================================
# Usage:
#   docker compose up -d                      # Start
#   docker compose --profile ai up -d         # Include Ollama
#   docker compose logs -f app                # View logs
#   docker compose down                       # Stop
#   docker compose exec app <command>         # Run commands
#
# Examples:
#   docker compose exec app pnpm lint:fix
#   docker compose exec app pnpm check-types
#   docker compose exec app pnpm test
#   docker compose exec -w /app/apps/admin-portal app pnpm db:migrate
# =============================================================================

name: admin-portal-dev

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: admin-portal-dev-postgres
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-business_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-business_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-business_portal}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: admin-portal-dev-redis
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password required}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: admin-portal-dev-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai

  app:
    build:
      context: ../..
      dockerfile: apps/admin-portal/Dockerfile.dev
    container_name: admin-portal-dev-node
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    working_dir: /app
    volumes:
      - ../..:/app:cached
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - CI=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-business_portal}:${POSTGRES_PASSWORD}@admin-portal-dev-postgres:5432/${POSTGRES_DB:-business_portal}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@admin-portal-dev-redis:6379
      - OLLAMA_URL=http://admin-portal-dev-ollama:11434
      - OLLAMA_REMOTE_URL=${OLLAMA_REMOTE_URL:-}
      - OPENAI_API_KEY=${ADMIN_PORTAL_OPENAI_API_KEY:-}
    env_file:
      - ../../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  node_modules:
  pnpm_store:
  ollama_data:
