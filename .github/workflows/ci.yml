name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

      # Admin-portal E2E is skipped for now: it needs Postgres and Redis
      - name: Build
        run: pnpm build

  website-e2e:
    name: Website E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      # Playwright builds the site and serves it with wrangler dev (no database or secrets)
      - name: Run E2E tests
        run: pnpm --filter website test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-playwright-report
          path: apps/website/playwright-report/
          retention-days: 7
