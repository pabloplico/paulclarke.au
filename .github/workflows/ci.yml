name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab: on main this also redeploys the website
  workflow_dispatch:

# Read-only token: CI only checks code, it never writes to the repo. The
# deploy job uses a Cloudflare token, not this one
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Local caching only: never connect to Nx Cloud
  NX_NO_CLOUD: true
  # Print every task's output in the job log, not just a summary
  NX_DEFAULT_OUTPUT_STYLE: static
  # PRs check only the projects they affect; pushes to main check everything
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

jobs:
  check:
    name: Lint, type-check, test and build
    # Pinned so a runner image change can't break CI unexpectedly
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # nx affected needs the history back to the merge base with main
          fetch-depth: 0
          filter: tree:0

      # Version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE/NX_HEAD to the PR's merge base with main. On pull_request
      # events it only runs git merge-base, so the read-only token is enough
      - name: Set base and head for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      # Reports test files added, deleted and changed, and assertions removed,
      # in the job summary, with a warning on each file that loses assertions.
      # It never fails the build: it's there so test edits get read on their own
      - name: Summarise test changes
        if: github.event_name == 'pull_request'
        run: bash scripts/test-diff-summary.sh "$NX_BASE" "$NX_HEAD"

      - name: Lint
        run: pnpm exec nx "$NX_RUN" -t lint lint:root

      - name: Type-check
        run: pnpm exec nx "$NX_RUN" -t check-types

      - name: Unit tests
        run: pnpm exec nx "$NX_RUN" -t test

      # The same tests in a random order, to catch tests that depend on each
      # other. Non-blocking for now: a failure shows as a warning on the run.
      # The seed is printed here and by Vitest ("Running tests with seed"); rerun
      # locally with: vitest run --sequence.shuffle --sequence.seed=<seed>
      - name: Unit tests, shuffled (non-blocking)
        continue-on-error: true
        run: |
          SEED=$(( (RANDOM << 15) | RANDOM ))
          echo "Shuffle seed: $SEED"
          echo "Shuffle seed: \`$SEED\`" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec nx "$NX_RUN" -t test -- --sequence.shuffle --sequence.seed="$SEED"

      # Admin-portal E2E is skipped for now: it needs Postgres
      - name: Build
        run: pnpm exec nx "$NX_RUN" -t build

  admin-db:
    name: Admin DB (fresh PGlite from migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set base and head for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      # Checks the schema hasn't drifted from the migrations, builds an
      # in-memory PGlite database from drizzle/, then smoke-tests it (tables,
      # pgvector search, a cascade delete). No Postgres service needed
      - name: Build and check a fresh database
        run: pnpm exec nx "$NX_RUN" -t db:check-fresh

  website-e2e:
    name: Website E2E (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set base and head for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Install Chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      # Playwright builds the site and serves it with wrangler dev (no database
      # or secrets). On a PR that doesn't affect the website, this does nothing
      - name: Run E2E tests
        run: pnpm exec nx "$NX_RUN" -t test:e2e --exclude='*,!website'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-playwright-report
          path: apps/website/playwright-report/
          retention-days: 7

  # Deploys the website to Cloudflare Workers once every check has passed on
  # main. Admin-portal-only pushes skip the deploy. The newest push cancels an
  # older run (see concurrency above), so deploys never land out of order
  deploy-website:
    name: Deploy website
    needs: [check, admin-db, website-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The Cloudflare secrets live on this environment, so only this job can
    # read them, and GitHub lists each deploy under Environments
    environment:
      name: production
      url: https://paulclarke.au

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # NX decides from its project graph, so changes to @repo/ui, shared
      # config or the lockfile count as website changes too. A manual run, or
      # a push whose previous commit isn't in the history, always deploys
      - name: Check the website changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          elif pnpm exec nx show projects --affected --json --base="$BEFORE" --head="$GITHUB_SHA" | grep -q '"website"'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
            echo "The website didn't change; nothing to deploy"
          fi

      # The website's deploy script: nx run website:build (blog posts, then the
      # Vite build), then wrangler deploy. Wrangler reads the token and account
      # from the environment
      - name: Build and deploy
        if: steps.changed.outputs.website == 'true'
        run: pnpm --filter website run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
